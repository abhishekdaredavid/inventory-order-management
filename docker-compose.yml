version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: inventorydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: inventory_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/inventorydb
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: inventory_frontend
    restart: always
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:5173"
    depends_on:
      - backend

volumes:
  postgres_data: